name: client-card-payment

on:
  push:
    branches: [main]
    paths:
      - 'Client-App-FrontEnd/**'
      - '.github/workflows/client-card-payment.yml'
  pull_request:
    paths:
      - 'Client-App-FrontEnd/**'
      - '.github/workflows/client-card-payment.yml'

permissions:
  contents: read

jobs:
  slice-f:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client-App-FrontEnd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Client-App-FrontEnd/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:card-payment-bundle
