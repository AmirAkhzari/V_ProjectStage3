<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F2F7" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("visitor-admin:ui:v1");
          var theme = "light";
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme === "dark") theme = "dark";
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#000000" : "#F2F2F7");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/fonts/IRANSansXFaNum-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/IRANSansXFaNum-Medium.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/IRANSansXFaNum-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="icon" href="/favicon.svg" />
    <title>ویزیتور — پنل مدیریت</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
