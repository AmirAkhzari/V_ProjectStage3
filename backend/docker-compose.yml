services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vproject
      POSTGRES_PASSWORD: vproject
      POSTGRES_DB: vproject
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vproject -d vproject']
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
