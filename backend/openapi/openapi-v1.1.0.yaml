components:
  securitySchemes:
    shopkeeperBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA JWT, typ=shopkeeper, aud=app
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA JWT, typ=staff, aud=admin; super_admin may send X-Scope-Distributor
    driverBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA JWT, typ=driver, aud=driver, single did
  parameters:
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Optional (clients SHOULD send it). Same semantics as IdempotencyKey when present.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Replay with same key+body => stored response; same key, different body => 422 IDEMPOTENCY_KEY_REUSE
    ScopeDistributor:
      name: X-Scope-Distributor
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: super_admin only; acting-as audited
  headers:
    XRequestId:
      schema:
        type: string
      description: Echoed/generated request id
    RetryAfter:
      schema:
        type: integer
  responses:
    Error:
      description: Error (uniform shape)
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details: {}
    ErrorCode:
      type: string
      description: See contract/ERROR_CODES.md
      enum:
      - VALIDATION_FAILED
      - UNAUTHENTICATED
      - TOKEN_TYPE_MISMATCH
      - SESSION_REVOKED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSE
      - IDEMPOTENCY_IN_PROGRESS
      - invalid_credentials
      - too_many_attempts
      - driver_inactive
      - PASSWORD_CHANGE_REQUIRED
      - CURRENT_PASSWORD_INVALID
      - PASSWORD_REUSED
      - PASSWORD_TOO_SHORT
      - PASSWORD_BREACHED
      - USERNAME_TAKEN
      - USERNAME_INVALID
      - session_expired
      - OTP_INVALID
      - OTP_LOCKED
      - MARKETPLACE_REQUIRES_PRO
      - DISTRIBUTOR_LOCKED
      - UNAVAILABLE_ITEMS
      - MOQ_NOT_MET
      - MIN_ORDER
      - PRICE_CHANGED
      - CAPACITY_UNAVAILABLE
      - INVALID_TRANSITION
      - ORDER_NOT_PAID
      - ORDER_NOT_CANCELLABLE
      - ORDER_NOT_SHIPPED
      - ACTIVE_DELIVERY_EXISTS
      - REASON_REQUIRED
      - REASON_TOO_LONG
      - DELIVERY_NOT_ACTIVE
      - DELIVERY_AWAITING_CONFIRMATION
      - DELIVERY_LOCKED
      - PAYMENT_VERIFICATION_PENDING
      - PAYMENT_NOT_STARTABLE
      - PAYMENT_AMOUNT_MISMATCH
      - REFUND_EXISTS
      - TOO_MANY_PENDING_PAYMENTS
      - REFUND_NOT_FOUND
      - WALLET_INSUFFICIENT
      - SERVICE_UNAVAILABLE
      - INTERNAL
      - DEPENDENCY_UNAVAILABLE
    Placeholder:
      type: object
      description: Schema pending E3-T2 (DL-23)
      additionalProperties: true
    OrderStatus:
      type: string
      enum:
      - awaiting_payment
      - pending
      - confirmed
      - packing
      - shipped
      - delivered
      - cancelled
    ClientOrderStatus:
      type: string
      enum:
      - current
      - delivered
      - cancelled
    DeliveryStatus:
      type: string
      enum:
      - assigned
      - awaiting_confirmation
      - confirmed
      - rejected
      - cancelled
      description: Active = assigned|awaiting_confirmation. Extensible (DL-47, P3).
    PaymentStatus:
      type: string
      enum:
      - pending
      - pending_verification
      - success
      - failed
      - expired
    RefundStatus:
      type: string
      enum:
      - requested
      - succeeded
      - failed
      - manual_review
    Payment:
      type: object
      required:
      - id
      - kind
      - amount
      - status
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - order
          - wallet_topup
          - subscription
        amount:
          type: integer
          format: int64
          description: Toman (DL-04)
        status:
          $ref: '#/components/schemas/PaymentStatus'
        holdUntil:
          type:
          - string
          - 'null'
          format: date-time
        refund:
          oneOf:
          - $ref: '#/components/schemas/Refund'
          - type: 'null'
    Refund:
      type: object
      required:
      - id
      - paymentId
      - status
      - amount
      description: Wallet-only refund (v2; confirmed in DECISION_LOG §I «Refunds»)
      properties:
        id:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RefundStatus'
        amount:
          type: integer
          format: int64
        reason:
          type: string
          enum:
          - order_cancelled
          - late_payment
          - hold_expired_paid
          - admin
        creditedAt:
          type:
          - string
          - 'null'
          format: date-time
    ReasonRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false
    OrderTransitionRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - confirmed
          - packing
          - shipped
          - delivered
          - cancelled
        note:
          type: string
          maxLength: 500
          description: Required (>=3) for cancelled and delivered(manual)
      additionalProperties: false
    DriverLoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          maxLength: 128
      additionalProperties: false
    DriverLoginError:
      type: string
      enum:
      - invalid_credentials
      - too_many_attempts
      description: 'Enumeration-safe (AppSec AUTH-LG-02): unknown user, wrong password and inactive account (even with correct password) all => invalid_credentials (same status/body/timing). FE LoginError
        union must drop inactive (FE ticket after Gate).'
    DriverPasswordChangeRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          description: Always required, incl. the forced first change (= temp password)
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: AUTH-PW-02 policy after NFKC; != current, != temp
    DriverSession:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresAt
      - driver
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: Session absolute expiry; unchanged by C11 (inherits original login auth_time + 10h)
        mustChangePassword:
          type: boolean
        driver:
          $ref: '#/components/schemas/Placeholder'
    DriverUnlockResponse:
      type: object
      required:
      - driverId
      - wasLocked
      - active
      properties:
        driverId:
          type: string
          format: uuid
        wasLocked:
          type: boolean
          description: false => idempotent no-op (still audited)
        lockedUntilBefore:
          type:
          - string
          - 'null'
          format: date-time
        active:
          type: boolean
          description: Unlock never reactivates; inactive driver still cannot log in
    EventEnvelope:
      type: object
      description: Outbox event envelope (E5-T5); not an HTTP payload
      required:
      - id
      - type
      - version
      - aggregate
      - occurredAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          examples:
          - payment.verification_pending
        version:
          type: integer
          minimum: 1
        aggregate:
          type: object
          required:
          - type
          - id
          properties:
            type:
              type: string
            id:
              type: string
        distributorId:
          type:
          - string
          - 'null'
          format: uuid
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
    IranMobile:
      type: string
      pattern: ^\+989[0-9]{9}$
      description: E.164 Iranian mobile only (+98 9xx...), staff included (DECISION_LOG §I LIM-OTP-01a..h; LIMITS LIM-OTP-01f). Clients normalise 09xx/989xx to this form before sending; anything else =>
        422 VALIDATION_FAILED without contacting the SMS provider.
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: 6-digit code from a CSPRNG; TTL <=2 min; single use; 5 attempts then invalid (LIM-OTP-01c/e)
    OtpSendRequest:
      type: object
      additionalProperties: false
      required:
      - phone
      properties:
        phone:
          $ref: '#/components/schemas/IranMobile'
    OtpSendResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - expiresInSeconds
      - resendAfterSeconds
      properties:
        status:
          type: string
          enum:
          - sent
        expiresInSeconds:
          type: integer
          minimum: 1
          maximum: 120
        resendAfterSeconds:
          type: integer
          minimum: 60
      description: Byte-identical for registered and unregistered phones and for suppressed sends (LIM-OTP-01h, AUTH enumeration safety); carries no account hint and no challenge id. A new send invalidates
        the previous code.
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - phone
      - code
      properties:
        phone:
          $ref: '#/components/schemas/IranMobile'
        code:
          $ref: '#/components/schemas/OtpCode'
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken: &id002
          type: string
          minLength: 43
          maxLength: 512
          description: Opaque, >=256-bit CSPRNG, single use, rotated per family (AUTH-RT-01/02); stored hashed server-side
      description: Refresh always validated in Postgres (arch §7.1.1, AUTH-AV-03). An RT is bound to its route group (AUTH-RT-04).
    RefreshLogoutRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken: *id002
      description: 'A4: revokes the family of this refresh token (AUTH-LO-01). Unknown/expired token => same 200 response.'
    EmptyRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: No body fields (bearer-authenticated logout / demo login)
    LogoutResponse:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
      description: Always the same body (idempotent; no information about the token state).
    ShopkeeperUser:
      type: object
      additionalProperties: false
      required:
      - id
      - phone
      - isNewAccount
      properties:
        id: &id003
          type: string
          format: uuid
        phone:
          $ref: '#/components/schemas/IranMobile'
        isNewAccount:
          type: boolean
          description: true when A2 created the account on first login (shown only after successful verify)
    ShopkeeperSession:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - accessTokenExpiresAt
      - refreshToken
      - refreshExpiresAt
      - absoluteExpiresAt
      - tokenType
      - user
      properties:
        accessToken: &id004
          type: string
          minLength: 1
          maxLength: 4096
          description: JWT EdDSA (Ed25519), kid required, 15 min (AUTH-JW-01)
        accessTokenExpiresAt: &id005
          type: string
          format: date-time
        refreshToken: *id002
        refreshExpiresAt: &id006
          type: string
          format: date-time
          description: '(J-2: named refreshExpiresAt, not expiresAt, because DriverSession.expiresAt (C11, frozen) means ABSOLUTE expiry) When the current refresh token stops being valid (idle/sliding window,
            capped by absoluteExpiresAt)'
        absoluteExpiresAt: &id007
          type: string
          format: date-time
          description: 'Session absolute expiry (AUTH-RT-03, DECISION_LOG §I): shopkeeper 90d, staff 7d, driver 10h; never extended by refresh'
        tokenType: &id008
          type: string
          enum:
          - Bearer
        user:
          $ref: '#/components/schemas/ShopkeeperUser'
      description: 'Shopkeeper: 30d sliding refresh, 90d absolute (DECISION_LOG §I «Retailer session»).'
    StaffUser:
      type: object
      additionalProperties: false
      required:
      - id
      - phone
      - role
      - distributorId
      - permissions
      properties:
        id: *id003
        phone:
          $ref: '#/components/schemas/IranMobile'
        role:
          type: string
          enum:
          - super_admin
          - distributor_admin
        distributorId:
          type:
          - string
          - 'null'
          format: uuid
          description: null for super_admin
        permissions:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z_]+\.[a-z_]+$
            maxLength: 64
          description: Permission keys (PERMISSION_MATRIX); display only, server re-checks
    StaffSession:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - accessTokenExpiresAt
      - refreshToken
      - refreshExpiresAt
      - absoluteExpiresAt
      - tokenType
      - staff
      properties:
        accessToken: *id004
        accessTokenExpiresAt: *id005
        refreshToken: *id002
        refreshExpiresAt: *id006
        absoluteExpiresAt: *id007
        tokenType: *id008
        staff:
          $ref: '#/components/schemas/StaffUser'
      description: 'Staff: 7d absolute + 12h idle (DECISION_LOG §I «Admin session»).'
    DriverUser:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - distributorId
      properties:
        id: *id003
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: NFKC-normalised username, <= 64 chars (AUTH-LG-01)
        distributorId: *id003
    DriverAuthSession:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - accessTokenExpiresAt
      - refreshToken
      - refreshExpiresAt
      - absoluteExpiresAt
      - tokenType
      - mustChangePassword
      - driver
      properties:
        accessToken: *id004
        accessTokenExpiresAt: *id005
        refreshToken: *id002
        refreshExpiresAt: *id006
        absoluteExpiresAt: *id007
        tokenType: *id008
        mustChangePassword:
          type: boolean
          description: true => only C11 is allowed (AUTH-PW-04, 403 PASSWORD_CHANGE_REQUIRED elsewhere)
        driver:
          $ref: '#/components/schemas/DriverUser'
      description: 'Driver: 10h absolute from login, not extended by refresh (DECISION_LOG §I «Driver session»). Closed counterpart of DriverSession (C11), which is left unchanged in v1.1.0.'
